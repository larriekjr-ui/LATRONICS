<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#0F6B6B">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="TRACKER">
<title>TRACKER</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EDF1EF;--surface:#FFFFFF;--ink:#14232B;--mute:#5E6F76;--line:#D5DDDA;
  --brand:#0F6B6B;--brand-ink:#FFFFFF;--out:#B3402F;--in:#1E7A4F;--accent:#D9A23A;--chip:#E3EAE7;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Instrument Sans",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0E1A1F;--surface:#16262D;--ink:#E7EFEC;--mute:#94A6AC;--line:#26393F;
    --brand:#3FB0A6;--brand-ink:#06201E;--out:#E27A67;--in:#57C08A;--accent:#E5B455;--chip:#1E3239;
  }
}
:root[data-theme="dark"]{
  --bg:#0E1A1F;--surface:#16262D;--ink:#E7EFEC;--mute:#94A6AC;--line:#26393F;
  --brand:#3FB0A6;--brand-ink:#06201E;--out:#E27A67;--in:#57C08A;--accent:#E5B455;--chip:#1E3239;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:400 16px/1.4 var(--body)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
[hidden]{display:none!important}

#app{max-width:480px;margin:0 auto;min-height:100%;padding:0 16px 150px}
header.top{display:flex;align-items:center;justify-content:space-between;padding:14px 0 6px}
.month{display:flex;align-items:center;gap:4px}
.month h1{font:600 18px var(--display);margin:0;min-width:140px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--mute)}
.iconbtn:active{background:var(--chip)}

.hero{background:var(--brand);color:var(--brand-ink);border-radius:22px;padding:22px 20px 18px;margin:8px 0 18px}
.hero .lbl{font-size:14px;opacity:.85}
.hero .big{font:700 40px/1.1 var(--display);letter-spacing:-.02em;margin:4px 0 16px;word-break:break-word}
.split{height:8px;border-radius:99px;background:rgba(255,255,255,.28);overflow:hidden;display:flex}
.split i{display:block;height:100%;background:var(--accent)}
.io{display:flex;justify-content:space-between;margin-top:12px;font-size:14px}
.io b{font:600 16px var(--display);display:block}

.day{margin:18px 0 6px;font:600 14px var(--body);color:var(--mute)}
.list{background:var(--surface);border-radius:18px;overflow:hidden}
.row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:active{background:var(--chip)}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.row .t{flex:1;min-width:0}
.row .t b{display:block;font-weight:600}
.row .t span{display:block;color:var(--mute);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.amt{font:600 16px var(--display);white-space:nowrap}
.amt.out{color:var(--out)} .amt.in{color:var(--in)}

.empty{text-align:center;padding:48px 20px;color:var(--mute)}
.empty h2{font:600 20px var(--display);color:var(--ink);margin:0 0 6px}

.card{background:var(--surface);border-radius:18px;padding:16px;margin-bottom:14px}
.card h2{font:600 17px var(--display);margin:0 0 12px}
.bar{margin:10px 0}
.bar .h{display:flex;justify-content:space-between;font-size:15px;margin-bottom:5px}
.bar .h span:last-child{font-weight:600}
.bar .tr{height:9px;border-radius:99px;background:var(--chip);overflow:hidden}
.bar .tr i{display:block;height:100%;border-radius:99px}
.months{display:flex;align-items:flex-end;gap:10px;height:130px;padding-top:6px}
.months .m{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.months .pair{display:flex;align-items:flex-end;gap:3px;height:100%;width:100%;justify-content:center}
.months .pair i{display:block;width:40%;max-width:18px;border-radius:5px 5px 2px 2px;min-height:2px}
.months small{color:var(--mute);font-size:12px}
.legend{display:flex;gap:16px;font-size:13px;color:var(--mute);margin-top:12px}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c)}

.setrow{display:flex;justify-content:space-between;align-items:center;width:100%;padding:14px 0;border-bottom:1px solid var(--line);text-align:left}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--mute);font-size:13px}
.setrow.danger b{color:var(--out)}

nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:5}
nav.tabs .in{display:flex;width:100%;max-width:480px}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:12px;color:var(--mute);border-radius:12px}
nav.tabs button[aria-current="true"]{color:var(--brand);font-weight:600}
.fab{position:fixed;right:max(16px,calc(50% - 224px));bottom:calc(84px + env(safe-area-inset-bottom,0px));height:56px;padding:0 22px 0 18px;border-radius:28px;background:var(--accent);color:#1b1405;font:600 16px var(--body);display:flex;align-items:center;gap:8px;box-shadow:0 6px 18px rgba(0,0,0,.22);z-index:6}
.fab:active{transform:scale(.97)}

.overlay{position:fixed;inset:0;background:rgba(6,14,17,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--bg);width:100%;max-width:480px;max-height:92%;overflow:auto;border-radius:24px 24px 0 0;padding:18px 18px calc(22px + env(safe-area-inset-bottom,0px));animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h3{font:600 20px var(--display);margin:0 0 14px}
.seg{display:flex;background:var(--chip);border-radius:14px;padding:4px;margin-bottom:14px}
.seg button{flex:1;padding:10px;border-radius:11px;font-weight:600;color:var(--mute)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.amtwrap{display:flex;align-items:baseline;gap:8px;background:var(--surface);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.amtwrap span{color:var(--mute);font-weight:600}
.amtwrap input{flex:1;min-width:0;border:0;background:none;color:var(--ink);font:700 32px var(--display);outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:14px}
.chips button{padding:9px 14px;border-radius:99px;background:var(--chip);font-size:15px}
.chips button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink);font-weight:600}
.field{display:block;margin-bottom:14px}
.field span{display:block;font-size:14px;color:var(--mute);margin-bottom:6px}
.field input,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:12px 14px;font:inherit}
.field textarea{min-height:110px;font-size:13px}
.btn{display:block;width:100%;padding:15px;border-radius:16px;background:var(--brand);color:var(--brand-ink);font-weight:600;text-align:center;margin-top:6px}
.btn.ghost{background:var(--chip);color:var(--ink)}
.btn.warn{background:var(--out);color:#fff}
.msg{min-height:20px;font-size:14px;color:var(--out);text-align:center;margin:6px 0}
.note{font-size:13px;color:var(--mute);margin:8px 0 0}

#lock{position:fixed;inset:0;z-index:50;background:var(--brand);color:var(--brand-ink);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
#lock h2{font:700 26px var(--display);margin:0 0 6px;text-align:center}
#lock p{margin:0 0 22px;opacity:.85;text-align:center;min-height:22px}
.pins{display:flex;gap:16px;margin-bottom:26px}
.pins i{width:16px;height:16px;border-radius:50%;border:2px solid var(--brand-ink);display:block}
.pins i.f{background:var(--brand-ink)}
.pins.shake{animation:sh .35s}
@keyframes sh{20%{transform:translateX(-10px)}40%{transform:translateX(10px)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.pad{display:grid;grid-template-columns:repeat(3,76px);gap:14px}
.pad button{height:76px;border-radius:50%;background:rgba(255,255,255,.16);font:600 28px var(--display);color:var(--brand-ink)}
.pad button:active{background:rgba(255,255,255,.34)}
.pad button.ph{visibility:hidden}
.linkbtn{margin-top:22px;color:var(--brand-ink);opacity:.8;text-decoration:underline;font-size:14px}
</style>
</head>
<body>
<div id="app" hidden>
  <div id="view"></div>
</div>
<button class="fab" id="fab" hidden aria-label="Add entry">
  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Add
</button>
<nav class="tabs" id="tabs" hidden><div class="in">
  <button data-v="entries"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>Entries</button>
  <button data-v="summary"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M5 20V10M12 20V4M19 20v-7"/></svg>Summary</button>
  <button data-v="settings"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</div></nav>

<div id="lock" hidden>
  <div style="font:700 15px var(--display);letter-spacing:.12em;opacity:.9;margin-bottom:18px">TRACKER</div><h2 id="lt"></h2><p id="lm"></p>
  <div class="pins" id="pins"><i></i><i></i><i></i><i></i></div>
  <div class="pad" id="pad"></div>
  <button class="linkbtn" id="forgot" hidden>Forgot PIN?</button>
</div>
<div id="ov" class="overlay" hidden></div>

<script>
(function(){
"use strict";
var KEY="pesa_tracker_v1";
var EXP=["Stock","Rent","Transport","Airtime & data","Food","Salaries","Utilities","Repairs","Personal","Other"];
var INC=["Sales","Repairs income","Other income"];
var COLORS=["#0F6B6B","#D9A23A","#B3402F","#5B7DB1","#8A5FA8","#3E9C6B","#C7683F","#6C7A89","#B08968","#4FA3A5"];
var S={pin:null,entries:[]};
var view="entries";
var cur=(function(){var d=new Date();return {y:d.getFullYear(),m:d.getMonth()};})();
var $=function(id){return document.getElementById(id)};
var fmt=new Intl.NumberFormat("en-US",{maximumFractionDigits:0});
function money(n){return "TSh "+fmt.format(Math.round(n))}
function p2(n){return n<10?"0"+n:""+n}
function today(){var d=new Date();return d.getFullYear()+"-"+p2(d.getMonth()+1)+"-"+p2(d.getDate())}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function catColor(c){var all=EXP.concat(INC);var i=all.indexOf(c);return COLORS[(i<0?all.length:i)%COLORS.length]}

/* storage */
function load(){try{var r=localStorage.getItem(KEY);if(r){var o=JSON.parse(r);if(o&&Array.isArray(o.entries)){S.pin=o.pin||null;S.entries=o.entries}}}catch(e){}}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){toast("Could not save on this browser")}}
function toast(t){var d=document.createElement("div");d.textContent=t;d.style.cssText="position:fixed;left:50%;transform:translateX(-50%);bottom:150px;background:#14232B;color:#fff;padding:10px 16px;border-radius:12px;z-index:99;font-size:14px";document.body.appendChild(d);setTimeout(function(){d.remove()},1800)}

/* PIN hashing */
async function hash(s){
  var str="pesa|"+s+"|salt7";
  try{var b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(str));return Array.from(new Uint8Array(b)).map(function(x){return x.toString(16).padStart(2,"0")}).join("")}
  catch(e){var h=5381;for(var i=0;i<str.length;i++){h=((h<<5)+h+str.charCodeAt(i))|0}return "f"+h}
}

/* lock screen */
var L={mode:"enter",buf:"",tmp:"",after:null,fails:0,until:0};
var TITLES={enter:"Enter your PIN",create:"Create a 4-digit PIN",confirm:"Confirm your PIN",oldcheck:"Enter your current PIN"};
function buildPad(){
  var h="";["1","2","3","4","5","6","7","8","9","","0","⌫"].forEach(function(k){
    h+=k===""?'<button class="ph" tabindex="-1"></button>':'<button data-k="'+k+'" aria-label="'+(k==="⌫"?"Delete":k)+'">'+k+'</button>';
  });
  $("pad").innerHTML=h;
}
function showLock(mode,after,msg){
  L.mode=mode;L.buf="";L.tmp="";L.after=after||null;
  $("lock").hidden=false;$("app").hidden=true;$("tabs").hidden=true;$("fab").hidden=true;closeSheet();
  $("lt").textContent=TITLES[mode];
  $("lm").textContent=msg||(mode==="create"&&!S.pin?"This PIN keeps your records private on this phone.":"");
  $("forgot").hidden=!(S.pin&&(mode==="enter"));
  drawPins();
}
function drawPins(){var d=$("pins").children;for(var i=0;i<4;i++)d[i].className=i<L.buf.length?"f":""}
function shake(){var p=$("pins");p.classList.remove("shake");void p.offsetWidth;p.classList.add("shake")}
async function pressKey(k){
  if(Date.now()<L.until){$("lm").textContent="Too many tries. Wait "+Math.ceil((L.until-Date.now())/1000)+"s.";return}
  if(k==="⌫"){L.buf=L.buf.slice(0,-1);drawPins();return}
  if(L.buf.length>=4)return;
  L.buf+=k;drawPins();
  if(L.buf.length<4)return;
  var buf=L.buf;
  if(L.mode==="enter"||L.mode==="oldcheck"){
    var h=await hash(buf);
    if(h===S.pin){
      L.fails=0;
      if(L.mode==="enter")unlock();else showLock("create",L.after);
    }else{
      L.fails++;shake();L.buf="";drawPins();
      if(L.fails>=5){L.until=Date.now()+30000;L.fails=0;$("lm").textContent="Too many tries. Wait 30s."}
      else $("lm").textContent="Wrong PIN. Try again.";
    }
  }else if(L.mode==="create"){
    L.tmp=buf;L.buf="";L.mode="confirm";$("lt").textContent=TITLES.confirm;$("lm").textContent="";drawPins();
  }else if(L.mode==="confirm"){
    if(buf===L.tmp){
      S.pin=await hash(buf);save();
      var a=L.after;
      if(a){$("lock").hidden=true;show();a()}else unlock();
    }else{
      shake();L.buf="";L.tmp="";L.mode="create";$("lt").textContent=TITLES.create;$("lm").textContent="PINs did not match. Start again.";drawPins();
    }
  }
}
function unlock(){$("lock").hidden=true;show();render()}
function show(){$("app").hidden=false;$("tabs").hidden=false;$("fab").hidden=(view!=="entries")}

/* sheets */
function openSheet(html){var o=$("ov");o.innerHTML='<div class="sheet" role="dialog" aria-modal="true">'+html+'</div>';o.hidden=false}
function closeSheet(){var o=$("ov");o.hidden=true;o.innerHTML=""}
$("ov").addEventListener("click",function(e){if(e.target===$("ov"))closeSheet()});
function confirmBox(title,text,label,fn){
  openSheet('<h3>'+esc(title)+'</h3><p class="note" style="font-size:15px;margin:0 0 14px">'+esc(text)+'</p><button class="btn warn" id="cy">'+esc(label)+'</button><button class="btn ghost" id="cn">Cancel</button>');
  $("cy").onclick=function(){closeSheet();fn()};$("cn").onclick=closeSheet;
}

/* data helpers */
function monthKey(y,m){return y+"-"+p2(m+1)}
function inMonth(y,m){var k=monthKey(y,m);return S.entries.filter(function(e){return e.date.slice(0,7)===k})}
function totals(list){var i=0,o=0;list.forEach(function(e){if(e.type==="in")i+=e.amt;else o+=e.amt});return {i:i,o:o}}
function monthLabel(y,m){return new Date(y,m,1).toLocaleDateString("en-GB",{month:"long",year:"numeric"})}
function dayLabel(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]).toLocaleDateString("en-GB",{weekday:"short",day:"numeric",month:"short"})}

/* render */
function render(){
  $("fab").hidden=$("app").hidden||view!=="entries";
  Array.prototype.forEach.call($("tabs").querySelectorAll("button"),function(b){b.setAttribute("aria-current",b.dataset.v===view?"true":"false")});
  var v=$("view");
  if(view==="entries")v.innerHTML=renderEntries();
  else if(view==="summary")v.innerHTML=renderSummary();
  else v.innerHTML=renderSettings();
  window.scrollTo(0,0);
}
function header(){
  return '<header class="top"><div class="month"><button class="iconbtn" data-a="prev" aria-label="Previous month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg></button><h1>'+monthLabel(cur.y,cur.m)+'</h1><button class="iconbtn" data-a="next" aria-label="Next month"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M9 5l7 7-7 7"/></svg></button></div><button class="iconbtn" data-a="lock" aria-label="Lock app"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button></header>';
}
function renderEntries(){
  var list=inMonth(cur.y,cur.m).sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:(a.id<b.id?1:-1)});
  var t=totals(list),net=t.i-t.o,sum=t.i+t.o;
  var pct=sum?Math.round(t.i/sum*100):0;
  var h=header();
  h+='<section class="hero"><div class="lbl">'+(net>=0?"Left this month":"Overspent this month")+'</div><div class="big">'+(net<0?"−":"")+money(Math.abs(net))+'</div><div class="split" aria-hidden="true"><i style="width:'+pct+'%"></i></div><div class="io"><div>Money in<b>'+money(t.i)+'</b></div><div style="text-align:right">Money out<b>'+money(t.o)+'</b></div></div></section>';
  if(!list.length){
    h+='<div class="empty"><h2>Nothing recorded yet</h2>Tap Add to record your first sale or expense for this month.</div>';
    return h;
  }
  var cur_d="",open=false;
  list.forEach(function(e){
    if(e.date!==cur_d){
      if(open)h+='</div>';
      cur_d=e.date;h+='<div class="day">'+dayLabel(e.date)+'</div><div class="list">';open=true;
    }
    h+='<button class="row" data-id="'+e.id+'"><span class="dot" style="background:'+catColor(e.cat)+'"></span><span class="t"><b>'+esc(e.cat)+'</b>'+(e.note?'<span>'+esc(e.note)+'</span>':'')+'</span><span class="amt '+(e.type==="in"?"in":"out")+'">'+(e.type==="in"?"+":"−")+fmt.format(e.amt)+'</span></button>';
  });
  if(open)h+='</div>';
  return h;
}
function renderSummary(){
  var h=header();
  var list=inMonth(cur.y,cur.m),t=totals(list);
  var by={};list.forEach(function(e){if(e.type==="out")by[e.cat]=(by[e.cat]||0)+e.amt});
  var cats=Object.keys(by).sort(function(a,b){return by[b]-by[a]});
  h+='<div class="card"><h2>Where the money went</h2>';
  if(!cats.length)h+='<p class="note">No expenses recorded this month.</p>';
  cats.forEach(function(c){
    var w=t.o?Math.max(3,Math.round(by[c]/t.o*100)):0;
    h+='<div class="bar"><div class="h"><span>'+esc(c)+'</span><span>'+money(by[c])+'</span></div><div class="tr"><i style="width:'+w+'%;background:'+catColor(c)+'"></i></div></div>';
  });
  h+='</div>';
  var ms=[],max=1;
  for(var k=5;k>=0;k--){
    var d=new Date(cur.y,cur.m-k,1),tt=totals(inMonth(d.getFullYear(),d.getMonth()));
    ms.push({l:d.toLocaleDateString("en-GB",{month:"short"}),i:tt.i,o:tt.o});max=Math.max(max,tt.i,tt.o);
  }
  h+='<div class="card"><h2>Last six months</h2><div class="months">';
  ms.forEach(function(m){
    h+='<div class="m"><div class="pair"><i style="height:'+Math.round(m.i/max*100)+'%;background:var(--in)"></i><i style="height:'+Math.round(m.o/max*100)+'%;background:var(--out)"></i></div><small>'+m.l+'</small></div>';
  });
  h+='</div><div class="legend"><span style="--c:var(--in)">Money in</span><span style="--c:var(--out)">Money out</span></div></div>';
  return h;
}
function renderSettings(){
  return '<header class="top"><h1 style="font:600 22px var(--display);margin:0">TRACKER · Settings</h1></header>'+
  '<div class="card" style="padding:4px 16px">'+
  '<button class="setrow" data-a="lock"><span><b>Lock now</b><small>Asks for your PIN again</small></span></button>'+
  '<button class="setrow" data-a="chpin"><span><b>Change PIN</b><small>Choose a new 4-digit PIN</small></span></button>'+
  '<button class="setrow" data-a="backup"><span><b>Back up my records</b><small>Copy a backup to save in Notes or WhatsApp</small></span></button>'+
  '<button class="setrow" data-a="restore"><span><b>Restore from backup</b><small>Paste a backup you saved earlier</small></span></button>'+
  '<button class="setrow danger" data-a="erase"><span><b>Erase all records</b><small>Removes everything on this phone</small></span></button>'+
  '</div><p class="note">Your records are stored only in this browser on this phone. Clearing browser data will delete them, so back up now and then.</p>';
}

/* add / edit sheet */
function entrySheet(id){
  var e=id?S.entries.filter(function(x){return x.id===id})[0]:null;
  var st={type:e?e.type:"out",cat:e?e.cat:EXP[0]};
  function chips(){
    var cs=st.type==="out"?EXP:INC;
    if(cs.indexOf(st.cat)<0)st.cat=cs[0];
    return cs.map(function(c){return '<button data-c="'+esc(c)+'" aria-pressed="'+(c===st.cat)+'">'+esc(c)+'</button>'}).join("");
  }
  openSheet('<h3>'+(e?"Edit entry":"New entry")+'</h3>'+
    '<div class="seg"><button data-t="out" aria-pressed="'+(st.type==="out")+'">Money out</button><button data-t="in" aria-pressed="'+(st.type==="in")+'">Money in</button></div>'+
    '<div class="amtwrap"><span>TSh</span><input id="fa" inputmode="numeric" autocomplete="off" placeholder="0" value="'+(e?fmt.format(e.amt):"")+'" aria-label="Amount"></div>'+
    '<div class="chips" id="fc">'+chips()+'</div>'+
    '<label class="field"><span>Note (optional)</span><input id="fn" maxlength="80" placeholder="e.g. Screen protectors from Kariakoo" value="'+(e?esc(e.note||""):"")+'"></label>'+
    '<label class="field"><span>Date</span><input id="fd" type="date" value="'+(e?e.date:today())+'"></label>'+
    '<div class="msg" id="fmsg"></div>'+
    '<button class="btn" id="fs">'+(e?"Save changes":"Save entry")+'</button>'+
    (e?'<button class="btn ghost" id="fdel" style="color:var(--out)">Delete entry</button>':''));
  var sh=$("ov").firstChild;
  sh.querySelector(".seg").onclick=function(ev){
    var b=ev.target.closest("button");if(!b)return;st.type=b.dataset.t;
    Array.prototype.forEach.call(sh.querySelectorAll(".seg button"),function(x){x.setAttribute("aria-pressed",x.dataset.t===st.type)});
    $("fc").innerHTML=chips();
  };
  $("fc").onclick=function(ev){
    var b=ev.target.closest("button");if(!b)return;st.cat=b.dataset.c;
    Array.prototype.forEach.call($("fc").children,function(x){x.setAttribute("aria-pressed",x.dataset.c===st.cat)});
  };
  $("fa").oninput=function(){var d=this.value.replace(/\D/g,"").slice(0,12);this.value=d?fmt.format(+d):""};
  $("fs").onclick=function(){
    var amt=+($("fa").value.replace(/\D/g,"")||0),date=$("fd").value;
    if(!amt){$("fmsg").textContent="Enter an amount greater than zero.";return}
    if(!date){$("fmsg").textContent="Choose a date.";return}
    var rec={id:e?e.id:uid(),type:st.type,amt:amt,cat:st.cat,note:$("fn").value.trim(),date:date};
    if(e){S.entries=S.entries.map(function(x){return x.id===e.id?rec:x})}else S.entries.push(rec);
    save();
    var p=date.split("-");cur={y:+p[0],m:+p[1]-1};
    closeSheet();render();toast("Saved");
  };
  if(e)$("fdel").onclick=function(){
    S.entries=S.entries.filter(function(x){return x.id!==e.id});save();closeSheet();render();toast("Deleted");
  };
  if(!e)setTimeout(function(){try{$("fa").focus()}catch(_){}},250);
}

/* settings actions */
function backupSheet(){
  var data=JSON.stringify({v:1,entries:S.entries});
  openSheet('<h3>Back up my records</h3><label class="field"><span>Copy this text and keep it somewhere safe</span><textarea id="bk" readonly></textarea></label><button class="btn" id="bc">Copy backup</button><button class="btn ghost" id="bx">Close</button>');
  $("bk").value=data;
  $("bc").onclick=function(){
    var ta=$("bk");ta.focus();ta.select();ta.setSelectionRange(0,ta.value.length);
    var done=function(){toast("Backup copied")};
    try{if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(data).then(done,function(){try{document.execCommand("copy");done()}catch(e){toast("Long-press the text and tap Copy")}})}else{document.execCommand("copy");done()}}
    catch(e){toast("Long-press the text and tap Copy")}
  };
  $("bx").onclick=closeSheet;
}
function restoreSheet(){
  openSheet('<h3>Restore from backup</h3><label class="field"><span>Paste your backup text here</span><textarea id="rt"></textarea></label><div class="msg" id="rm"></div><button class="btn" id="rr">Restore</button><button class="btn ghost" id="rx">Cancel</button>');
  $("rx").onclick=closeSheet;
  $("rr").onclick=function(){
    try{
      var o=JSON.parse($("rt").value.trim());
      if(!o||!Array.isArray(o.entries))throw 0;
      var clean=o.entries.filter(function(e){return e&&e.id&&(e.type==="in"||e.type==="out")&&+e.amt>0&&/^\d{4}-\d{2}-\d{2}$/.test(e.date)}).map(function(e){return {id:String(e.id),type:e.type,amt:+e.amt,cat:String(e.cat||"Other").slice(0,40),note:String(e.note||"").slice(0,80),date:e.date}});
      var ids={};S.entries.forEach(function(e){ids[e.id]=1});
      var added=0;clean.forEach(function(e){if(!ids[e.id]){S.entries.push(e);added++}});
      save();closeSheet();render();toast(added+" entries restored");
    }catch(e){$("rm").textContent="That does not look like a valid backup."}
  };
}
function act(a){
  if(a==="prev"){cur.m--;if(cur.m<0){cur.m=11;cur.y--}render()}
  else if(a==="next"){cur.m++;if(cur.m>11){cur.m=0;cur.y++}render()}
  else if(a==="lock")showLock("enter");
  else if(a==="chpin")showLock("oldcheck",function(){view="settings";render();toast("PIN changed")});
  else if(a==="backup")backupSheet();
  else if(a==="restore")restoreSheet();
  else if(a==="erase")confirmBox("Erase all records?","This deletes every entry on this phone and cannot be undone. Your PIN stays the same.","Erase everything",function(){S.entries=[];save();render();toast("All records erased")});
}

/* events */
$("view").addEventListener("click",function(e){
  var r=e.target.closest(".row");if(r){entrySheet(r.dataset.id);return}
  var b=e.target.closest("[data-a]");if(b)act(b.dataset.a);
});
$("tabs").addEventListener("click",function(e){var b=e.target.closest("button");if(!b)return;view=b.dataset.v;render()});
$("fab").addEventListener("click",function(){entrySheet()});
$("pad").addEventListener("click",function(e){var b=e.target.closest("button[data-k]");if(b)pressKey(b.dataset.k)});
document.addEventListener("keydown",function(e){
  if($("lock").hidden)return;
  if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==="Backspace")pressKey("⌫");
});
$("forgot").addEventListener("click",function(){
  openSheet('<h3>Forgot your PIN?</h3><p class="note" style="font-size:15px;margin:0 0 14px">The only way back in is to erase all records and set a new PIN. If you saved a backup, you can restore it afterwards.</p><button class="btn warn" id="fy">Erase and start over</button><button class="btn ghost" id="fn2">Cancel</button>');
  $("ov").style.zIndex=60;
  $("fn2").onclick=closeSheet;
  $("fy").onclick=function(){S={pin:null,entries:[]};save();closeSheet();showLock("create")};
});

/* auto-lock after a minute away */
var hiddenAt=0;
document.addEventListener("visibilitychange",function(){
  if(document.hidden){hiddenAt=Date.now()}
  else if(S.pin&&hiddenAt&&Date.now()-hiddenAt>60000&&$("lock").hidden){showLock("enter")}
});

/* start */
buildPad();load();
showLock(S.pin?"enter":"create");
})();
</script>
</body>
</html>
