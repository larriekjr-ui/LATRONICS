<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>LATRONIC</title>
<style>
:root{
  --bg:#eef1ef;--card:#ffffff;--ink:#10201c;--mut:#5f6f6a;--line:#dde3e0;
  --acc:#0b7a5e;--acc-ink:#ffffff;--acc-soft:#dff2ec;--sun:#f2b705;
  --good:#0b7a5e;--warn:#b26a00;--bad:#c62828;--bad-soft:#fdeaea;--warn-soft:#fff3d6;
  --tape:#fffef8;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0c1512;--card:#15211d;--ink:#e8f0ed;--mut:#93a49e;--line:#26352f;
    --acc:#2fc39c;--acc-ink:#04140f;--acc-soft:#123128;--sun:#f2b705;
    --good:#2fc39c;--warn:#f0b040;--bad:#ff7b72;--bad-soft:#3a1c1c;--warn-soft:#3a2f10;--tape:#1b2924;
  }
}
:root[data-theme="dark"]{
  --bg:#0c1512;--card:#15211d;--ink:#e8f0ed;--mut:#93a49e;--line:#26352f;
  --acc:#2fc39c;--acc-ink:#04140f;--acc-soft:#123128;--sun:#f2b705;
  --good:#2fc39c;--warn:#f0b040;--bad:#ff7b72;--bad-soft:#3a1c1c;--warn-soft:#3a2f10;--tape:#1b2924;
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;text-align:left}
#app{height:100%;display:flex;flex-direction:column;max-width:640px;margin:0 auto;background:var(--bg)}
header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;flex:none}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:19px;letter-spacing:.14em}
.brand svg{color:var(--sun);filter:drop-shadow(0 0 0 var(--ink))}
header.sub{display:grid;grid-template-columns:44px 1fr 44px;align-items:center}
header.sub h1{margin:0;font-size:18px;text-align:center}
.ib{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink)}
.ib:active{background:var(--line)}
main{flex:1;overflow-y:auto;padding:4px 16px 20px;-webkit-overflow-scrolling:touch}
nav{flex:none;display:grid;grid-template-columns:repeat(5,1fr);background:var(--card);border-top:1px solid var(--line);padding:6px 4px}
nav button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;color:var(--mut);border-radius:12px}
nav button.on{color:var(--acc);font-weight:700}
nav button.on svg{stroke-width:2.3}
.tape{background:var(--tape);border:1px solid var(--line);border-radius:6px;padding:16px 16px 20px;position:relative;margin:6px 0 14px;
  -webkit-mask:radial-gradient(circle 7px at 7px 100%,#0000 98%,#000) -7px 0/14px 100%;mask:radial-gradient(circle 7px at 7px 100%,#0000 98%,#000) -7px 0/14px 100%}
.tape .l{display:flex;justify-content:space-between;align-items:baseline;padding:5px 0;border-bottom:1px dashed var(--line)}
.tape .l:last-child{border-bottom:0}
.tape .l span{color:var(--mut)}
.tape .l b{font-variant-numeric:tabular-nums}
.tape .big{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em;margin:2px 0 8px}
.tape .cap{color:var(--mut);font-size:13px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card small{color:var(--mut);display:block}
.card b{font-size:17px;font-variant-numeric:tabular-nums}
.alert{display:flex;gap:10px;align-items:center;background:var(--warn-soft);color:var(--warn);border-radius:12px;padding:10px 12px;margin:10px 0;font-weight:600;width:100%}
.alert.bad{background:var(--bad-soft);color:var(--bad)}
.sec{margin:18px 2px 8px;font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.sec a,.sec button{color:var(--acc);font-weight:600;font-size:13.5px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:11px 13px;width:100%}
.row:active{background:var(--acc-soft)}
.row .grow{flex:1;min-width:0}
.row b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row small{color:var(--mut);display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .r{text-align:right;flex:none}
.row .r b{font-variant-numeric:tabular-nums}
.row.out{opacity:.55}
.bad{color:var(--bad)!important}.good{color:var(--good)!important}.warn{color:var(--warn)!important}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--acc-soft);color:var(--acc)}
.pill.bad{background:var(--bad-soft)}.pill.warn{background:var(--warn-soft)}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--line);border-radius:12px;padding:3px;margin:6px 0 10px}
.seg button{text-align:center;padding:9px;border-radius:10px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:7px 13px;border-radius:99px;background:var(--card);border:1px solid var(--line);font-size:13.5px;white-space:nowrap}
.chip.on{background:var(--acc);color:var(--acc-ink);border-color:var(--acc);font-weight:700}
.search input{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:8px}
input,select,textarea{width:100%;padding:11px 12px;border-radius:10px;border:1px solid var(--line);background:var(--card);outline:0}
input:focus,select:focus,textarea:focus{border-color:var(--acc);box-shadow:0 0 0 3px var(--acc-soft)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 16px;border-radius:12px;font-weight:700;text-align:center;background:var(--card);border:1px solid var(--line)}
.btn.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent;border:1px dashed var(--acc);color:var(--acc)}
.btn.wide{width:100%;margin:2px 0 10px}
.btn:active{filter:brightness(.93)}
.cartbar{flex:none;margin:0 12px 8px;background:var(--acc);color:var(--acc-ink);border-radius:14px;padding:13px 16px;display:flex;justify-content:space-between;font-weight:800;box-shadow:0 6px 18px rgba(11,122,94,.35)}
.empty{text-align:center;color:var(--mut);padding:34px 20px}
.empty b{display:block;color:var(--ink);margin-bottom:4px}
#sheet{position:fixed;inset:0;display:none;z-index:20}
#sheet.open{display:block}
#sheet .back{position:absolute;inset:0;background:rgba(6,14,11,.5)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--bg);border-radius:20px 20px 0 0;max-height:92%;display:flex;flex-direction:column;animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.sh-h{display:flex;justify-content:space-between;align-items:center;padding:16px 18px 8px;font-size:17px}
.x{width:36px;height:36px;border-radius:10px;color:var(--mut);text-align:center}
.sh-b{overflow-y:auto;padding:4px 18px 10px}
.sh-f{display:flex;gap:10px;padding:10px 18px calc(14px + env(safe-area-inset-bottom,0px))}
.sh-f .btn{flex:1}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld{grid-column:1/-1;display:flex;flex-direction:column;gap:4px}
.fld.half{grid-column:auto}
.fld span{font-size:13px;color:var(--mut)}
.kv{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line)}
.kv span{color:var(--mut)}
.kv:last-child{border-bottom:0}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:10px;background:var(--card);border:1px solid var(--line);text-align:center;font-weight:800;font-size:18px;line-height:1}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace;white-space:pre-wrap;background:var(--tape);border:1px solid var(--line);border-radius:8px;padding:14px;font-size:13px}
.bars{display:flex;align-items:flex-end;gap:8px;height:110px;padding-top:6px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;font-size:11px;color:var(--mut);gap:4px}
.bars i{display:block;width:100%;background:var(--acc);border-radius:6px 6px 2px 2px;min-height:3px}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--acc)}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:40;display:none;max-width:88%;text-align:center}
.lock{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:20px}
.dots{display:flex;gap:12px;height:16px}
.dots i{width:14px;height:14px;border-radius:50%;border:2px solid var(--acc)}
.dots i.f{background:var(--acc)}
.pad{display:grid;grid-template-columns:repeat(3,72px);gap:14px}
.pad button{height:72px;border-radius:50%;background:var(--card);border:1px solid var(--line);font-size:24px;font-weight:600;text-align:center}
.pad button:active{background:var(--acc-soft)}
.note{color:var(--mut);font-size:13px;margin:8px 2px}
.menu .row{padding:14px}
.menu .ico{width:38px;height:38px;border-radius:11px;background:var(--acc-soft);color:var(--acc);display:grid;place-items:center;flex:none}
</style>
</head>
<body>
<div id="app"></div>
<div id="sheet"></div>
<div id="toast"></div>

<script>
/* ---------- storage ---------- */
var KEY='latronic:v1';
function defaults(){return{v:1,seq:1,
  settings:{shop:'LATRONIC',cur:'TSh',low:3,pin:''},
  cats:['Smartphones','Feature phones','Tablets & laptops','Phone cases & covers','Screen protectors','Chargers & adapters','Cables','Earphones & headphones','Power banks','Memory cards & flash','Speakers','Smart watches','Spare parts','Other accessories'],
  products:[],sales:[],customers:[],suppliers:[],expenses:[],repairs:[],payables:[],purchases:[]};}
function load(){try{var r=localStorage.getItem(KEY);if(r){var d=JSON.parse(r),df=defaults();for(var k in df){if(d[k]===undefined)d[k]=df[k];}for(var s in df.settings){if(d.settings[s]===undefined)d.settings[s]=df.settings[s];}return d;}}catch(e){}return defaults();}
var storageOK=true;
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){if(storageOK){storageOK=false;toast('Cannot save on this browser. Check storage settings.');}}}
var DB=load();

/* ---------- helpers ---------- */
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s==null?'':s).replace(/[&<>"']/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})};
var sum=function(a,f){return a.reduce(function(x,y){return x+(+f(y)||0)},0)};
var uid=function(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6)};
var p2=function(n){return String(n).padStart(2,'0')};
function ymd(d){d=d||new Date();return d.getFullYear()+'-'+p2(d.getMonth()+1)+'-'+p2(d.getDate())}
var MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
function fdate(s){if(!s)return'';var a=s.split('-');return (+a[2])+' '+MON[+a[1]-1]}
function fdt(ts){var d=new Date(ts);return fdate(ymd(d))+' '+p2(d.getHours())+':'+p2(d.getMinutes())}
function fmt(n){return Math.round(+n||0).toLocaleString('en-US')}
function money(n){return DB.settings.cur+' '+fmt(n)}
function toast(m){var t=$('#toast');t.textContent=m;t.style.display='block';clearTimeout(toast.h);toast.h=setTimeout(function(){t.style.display='none'},2400)}
function ic(d){return '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+d+'</svg>'}
var I={
 home:ic('<path d="M3 11l9-8 9 8v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>'),
 sell:ic('<path d="M6 6h15l-1.5 9h-12z"/><path d="M6 6L5 3H2"/><circle cx="9" cy="20" r="1"/><circle cx="18" cy="20" r="1"/>'),
 stock:ic('<path d="M21 8l-9-5-9 5v8l9 5 9-5z"/><path d="M3 8l9 5 9-5"/><path d="M12 13v8"/>'),
 rep:ic('<path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.5 2.5-2.2-.5-.5-2.2z"/>'),
 more:ic('<circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/>'),
 back:ic('<path d="M15 5l-7 7 7 7"/>'),
 lock:ic('<rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/>'),
 bolt:'<svg viewBox="0 0 24 24" width="22" height="22" fill="currentColor" stroke="#10201c" stroke-width="1"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
 users:ic('<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7M18 14a6.5 6.5 0 0 1 3.5 6"/>'),
 truck:ic('<path d="M2 6h11v10H2z"/><path d="M13 9h5l3 3v4h-8"/><circle cx="6" cy="18" r="1.6"/><circle cx="17" cy="18" r="1.6"/>'),
 cash:ic('<rect x="2.5" y="6" width="19" height="12" rx="2"/><circle cx="12" cy="12" r="2.5"/>'),
 debt:ic('<path d="M12 3v18"/><path d="M16.5 7.5c-1-1.3-2.6-2-4.5-2-2.5 0-4 1.2-4 3s1.4 2.6 4 3 4 1.3 4 3-1.6 3-4 3c-2 0-3.7-.8-4.7-2.2"/>'),
 chart:ic('<path d="M4 20V10M10 20V4M16 20v-8M22 20H2"/>'),
 tag:ic('<path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.2"/>'),
 gear:ic('<circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/>')
};

/* ---------- state ---------- */
var S={tab:'home',sub:null,sm:'new',q1:'',q2:'',cat:'All',cat2:'All',cart:[],disc:'',cust:'',method:'Cash',paid:'',note:'',period:'today',repF:'All',debtT:'in',pinIn:'',pinErr:''};
var locked=!!DB.settings.pin;
var METHODS=['Cash','M-Pesa','Tigo Pesa','Airtel Money','HaloPesa','Bank'];
var EXPCATS=['Rent','Electricity','Transport','Salaries','Internet & airtime','Taxes & licences','Marketing','Repairs & maintenance','Other'];
var STATUS=['Received','In progress','Ready','Delivered'];
var PERIODS=[['today','Today'],['week','7 days'],['month','This month'],['all','All time']];
var SUBT={customers:'Customers',suppliers:'Suppliers',expenses:'Expenses',debts:'Debts',reports:'Reports',cats:'Categories',settings:'Settings & backup'};

/* ---------- lookups ---------- */
function prod(id){return DB.products.find(function(p){return p.id===id})}
function cust(id){return DB.customers.find(function(c){return c.id===id})}
function supp(id){return DB.suppliers.find(function(c){return c.id===id})}
function empty(t,s){return '<div class="empty"><b>'+t+'</b>'+(s||'')+'</div>'}
function startOf(p){var d=new Date();if(p==='today')return ymd(d);if(p==='week'){d.setDate(d.getDate()-6);return ymd(d)}if(p==='month'){d.setDate(1);return ymd(d)}return''}
function stats(p){
  var st=startOf(p),inR=function(d){return !!d&&d>=st};
  var sales=DB.sales.filter(function(s){return inR(s.date)});
  var reps=DB.repairs.filter(function(r){return r.status==='Delivered'&&inR(r.doneOn)});
  var exps=DB.expenses.filter(function(e){return inR(e.date)});
  var rev=sum(sales,function(s){return s.total}),cogs=sum(sales,function(s){return sum(s.items,function(i){return i.cost*i.qty})});
  var rrev=sum(reps,function(r){return r.charge}),rcost=sum(reps,function(r){return r.parts});
  var exp=sum(exps,function(e){return e.amount});
  var gross=rev-cogs+rrev-rcost;
  return{sales:sales,reps:reps,exps:exps,rev:rev,cogs:cogs,rrev:rrev,rcost:rcost,exp:exp,gross:gross,net:gross-exp};
}
function owedBy(cid){return sum(DB.sales.filter(function(s){return s.cust===cid}),function(s){return s.total-s.paid})}

/* ---------- shell ---------- */
function chipsPeriod(){return '<div class="chips">'+PERIODS.map(function(p){return '<button class="chip '+(S.period===p[0]?'on':'')+'" data-a="period" data-v="'+p[0]+'">'+p[1]+'</button>'}).join('')+'</div>'}
function render(){
  var app=$('#app');
  if(locked){app.innerHTML=lockView();return}
  var head=S.sub
    ?'<header class="sub"><button class="ib" data-a="back">'+I.back+'</button><h1>'+SUBT[S.sub]+'</h1><span></span></header>'
    :'<header><div class="brand">'+I.bolt+'<span>LATRONIC</span></div>'+(DB.settings.pin?'<button class="ib" data-a="lock" aria-label="Lock">'+I.lock+'</button>':'<span></span>')+'</header>';
  var body;
  if(S.sub){body=({customers:custView,suppliers:suppView,expenses:expView,debts:debtView,reports:repView,cats:catView,settings:setView})[S.sub]()}
  else body=({home:homeView,sell:sellView,stock:stockView,repairs:repairView,more:moreView})[S.tab]();
  var cartbar='';
  if(!S.sub&&S.tab==='sell'&&S.sm==='new'&&S.cart.length){cartbar='<button class="cartbar" data-a="cart"><span>'+sum(S.cart,function(c){return c.qty})+' items</span><span>'+money(cartTotal())+'  ›</span></button>'}
  var tabs=[['home','Home',I.home],['sell','Sell',I.sell],['stock','Stock',I.stock],['repairs','Repairs',I.rep],['more','More',I.more]];
  var nav='<nav>'+tabs.map(function(t){return '<button class="'+(!S.sub&&S.tab===t[0]||S.sub&&t[0]==='more'?'on':'')+'" data-a="tab" data-v="'+t[0]+'">'+t[2]+'<span>'+t[1]+'</span></button>'}).join('')+'</nav>';
  var keep=$('#main')?$('#main').scrollTop:0;
  app.innerHTML=head+'<main id="main">'+body+'</main>'+cartbar+nav;
  if(S.keepScroll){$('#main').scrollTop=keep;S.keepScroll=false}
}

/* ---------- lock ---------- */
function hp(p){try{return btoa('lt|'+p)}catch(e){return p}}
function lockView(){
  var n=S.pinIn.length,dots='';for(var i=0;i<6;i++)dots+='<i class="'+(i<n?'f':'')+'"></i>';
  var keys='';['1','2','3','4','5','6','7','8','9','','0','⌫'].forEach(function(k){keys+=k===''?'<span></span>':'<button data-a="k" data-v="'+k+'">'+k+'</button>'});
  return '<div class="lock"><div class="brand" style="font-size:26px">'+I.bolt+'<span>LATRONIC</span></div><div class="note">Enter your PIN</div><div class="dots">'+dots+'</div><div class="bad" style="height:18px">'+esc(S.pinErr)+'</div><div class="pad">'+keys+'</div></div>';
}
function pinKey(k){
  if(k==='⌫')S.pinIn=S.pinIn.slice(0,-1);else if(S.pinIn.length<6)S.pinIn+=k;
  S.pinErr='';
  if(S.pinIn.length>=4&&hp(S.pinIn)===DB.settings.pin){locked=false;S.pinIn=''}
  else if(S.pinIn.length===6){S.pinErr='Wrong PIN. Try again.';S.pinIn=''}
  render();
}

/* ---------- home ---------- */
function homeView(){
  var st=stats('today');
  var low=DB.products.filter(function(p){return p.qty<=p.min});
  var owed=sum(DB.sales,function(s){return s.total-s.paid});
  var iowe=sum(DB.payables,function(p){return p.amount-p.paid});
  var open=DB.repairs.filter(function(r){return r.status!=='Delivered'}).length;
  var ready=DB.repairs.filter(function(r){return r.status==='Ready'}).length;
  var out='<div class="tape"><div class="cap">Sales today, '+fdate(ymd())+'</div><div class="big">'+money(st.rev+st.rrev)+'</div>'
   +'<div class="l"><span>Items sold</span><b>'+sum(st.sales,function(s){return sum(s.items,function(i){return i.qty})})+'</b></div>'
   +'<div class="l"><span>Profit before expenses</span><b class="'+(st.gross<0?'bad':'')+'">'+money(st.gross)+'</b></div>'
   +'<div class="l"><span>Expenses</span><b>'+money(st.exp)+'</b></div>'

/* ---------- sell ---------- */
function cartTotal(){var sub=sum(S.cart,function(c){return c.qty*c.price});return Math.max(0,sub-(+S.disc||0))}
function sellView(){
  var seg='<div class="seg"><button class="'+(S.sm==='new'?'on':'')+'" data-a="sm" data-v="new">New sale</button><button class="'+(S.sm==='hist'?'on':'')+'" data-a="sm" data-v="hist">History</button></div>';
  if(S.sm==='hist')return seg+'<div class="list">'+(DB.sales.length?DB.sales.slice(0,150).map(saleRow).join(''):empty('No sales yet'))+'</div>';
  return seg+'<div class="search"><input id="q1" placeholder="Search product or brand" value="'+esc(S.q1)+'"></div>'+catChips('cat')
   +'<button class="btn ghost wide" data-a="custom">+ Custom item or service</button><div id="list" class="list">'+sellList()+'</div>';
}
function catChips(key){return '<div class="chips">'+['All'].concat(DB.cats).map(function(c){return '<button class="chip '+(S[key]===c?'on':'')+'" data-a="'+key+'" data-v="'+esc(c)+'">'+esc(c)+'</button>'}).join('')+'</div>'}
function matchP(p,q,c){return (c==='All'||p.cat===c)&&(!q||(p.name+' '+p.brand+' '+p.sku).toLowerCase().indexOf(q.toLowerCase())>-1)}
function sellList(){
  if(!DB.products.length)return empty('No products yet','Add products in the Stock tab, or use Custom item.');
  var items=DB.products.filter(function(p){return matchP(p,S.q1,S.cat)});
  if(!items.length)return empty('No match');
  return items.map(function(p){return '<button class="row '+(p.qty<=0?'out':'')+'" data-a="add" data-id="'+p.id+'"><div class="grow"><b>'+esc(p.name)+'</b><small>'+esc(p.cat)+(p.brand?' · '+esc(p.brand):'')+'</small></div><div class="r"><b>'+money(p.price)+'</b><small class="'+(p.qty<=p.min?'bad':'')+'">'+p.qty+' in stock</small></div></button>'}).join('');
}
function addToCart(id){
  var p=prod(id);if(!p)return;
  var c=S.cart.find(function(x){return x.pid===id});
  var have=c?c.qty:0;
  if(have+1>p.qty){toast('Only '+p.qty+' in stock');return}
  if(c)c.qty++;else S.cart.push({pid:id,name:p.name,cat:p.cat,qty:1,price:p.price,cost:p.cost});
  S.keepScroll=true;render();
}
function readCart(){
  if(!$('#c_disc'))return;
  S.disc=$('#c_disc').value;S.cust=$('#c_cust').value;S.method=$('#c_method').value;S.paid=$('#c_paid').value;S.note=$('#c_note').value;
}
function cartSheet(){
  if(!S.cart.length){closeSheet();render();return}
  var rows=S.cart.map(function(c,i){return '<div class="kv" style="align-items:center"><div style="flex:1;min-width:0"><b>'+esc(c.name)+'</b><div class="note" style="margin:0">'+money(c.price)+' each</div></div><div class="qty"><button data-a="cq" data-i="'+i+'" data-v="-1">−</button><b>'+c.qty+'</b><button data-a="cq" data-i="'+i+'" data-v="1">+</button></div><b style="width:92px;text-align:right">'+fmt(c.qty*c.price)+'</b></div>'}).join('');
  var custOpts='<option value="">Walk-in customer</option>'+DB.customers.map(function(c){return '<option value="'+c.id+'" '+(S.cust===c.id?'selected':'')+'>'+esc(c.name)+'</option>'}).join('');
  var mOpts=METHODS.map(function(m){return '<option '+(S.method===m?'selected':'')+'>'+m+'</option>'}).join('');
  openSheet('<div class="sh-h"><b>Checkout</b><button class="x" data-a="close">✕</button></div><div class="sh-b">'+rows
   +'<div class="form" style="margin-top:12px"><label class="fld half"><span>Discount</span><input id="c_disc" type="number" inputmode="decimal" min="0" value="'+esc(S.disc)+'" placeholder="0"></label>'
   +'<label class="fld half"><span>Payment method</span><select id="c_method">'+mOpts+'</select></label>'
   +'<label class="fld"><span>Customer (needed if part-paid)</span><select id="c_cust">'+custOpts+'</select></label>'
   +'<label class="fld"><span>Amount paid now (leave empty if paid in full)</span><input id="c_paid" type="number" inputmode="decimal" min="0" value="'+esc(S.paid)+'"></label>'
   +'<label class="fld"><span>Note</span><input id="c_note" value="'+esc(S.note)+'" placeholder="Optional"></label></div>'
   +'<div class="kv" style="margin-top:10px"><span>Total</span><b id="c_tot" style="font-size:20px">'+money(cartTotal())+'</b></div></div>'
   +'<div class="sh-f"><button class="btn" data-a="clearcart">Clear</button><button class="btn pri" data-a="finish">Complete sale</button></div>');
}
function finishSale(){
  readCart();
  var total=cartTotal(),paid=S.paid===''?total:Math.min(+S.paid||0,total);
  if(paid<total&&!S.cust){toast('Choose a customer for part-paid sales');return}
  for(var i=0;i<S.cart.length;i++){var c=S.cart[i];if(c.pid){var p=prod(c.pid);if(!p||p.qty<c.qty){toast('Not enough stock: '+c.name);return}}}
  S.cart.forEach(function(c){if(c.pid)prod(c.pid).qty-=c.qty});
  var sale={id:uid(),no:DB.seq++,ts:Date.now(),date:ymd(),items:S.cart.map(function(c){return{pid:c.pid||'',name:c.name,cat:c.cat||'Other',qty:c.qty,price:c.price,cost:c.cost||0}}),disc:+S.disc||0,total:total,paid:paid,method:S.method,cust:S.cust,note:S.note,pays:[]};
  DB.sales.unshift(sale);save();
  S.cart=[];S.disc='';S.paid='';S.note='';S.cust='';
  receiptSheet(sale,true);render();
}
function receiptText(s){
  var L=[DB.settings.shop,'Receipt #'+s.no,fdt(s.ts),'------------------------'];
  s.items.forEach(function(i){L.push(i.qty+' x '+i.name+'  '+fmt(i.price*i.qty))});
  L.push('------------------------');
  if(s.disc)L.push('Discount: '+fmt(s.disc));
  L.push('TOTAL: '+money(s.total),'Paid: '+money(s.paid)+' ('+s.method+')');
  if(s.total>s.paid)L.push('Balance: '+money(s.total-s.paid));
  L.push('Thank you!');return L.join('\n');
}
function receiptSheet(s,fresh){
  var t=receiptText(s);
  openSheet('<div class="sh-h"><b>'+(fresh?'Sale saved':'Receipt #'+s.no)+'</b><button class="x" data-a="close">✕</button></div><div class="sh-b"><div class="mono" id="rtxt">'+esc(t)+'</div></div><div class="sh-f"><a class="btn" style="text-decoration:none;color:inherit" target="_blank" rel="noopener" href="https://wa.me/?text='+encodeURIComponent(t)+'">WhatsApp</a><button class="btn pri" data-a="copy" data-v="rtxt">Copy</button></div>');
}
function saleSheet(id){
  var s=DB.sales.find(function(x){return x.id===id});if(!s)return;
  var bal=s.total-s.paid,c=cust(s.cust);
  openSheet('<div class="sh-h"><b>Sale #'+s.no+'</b><button class="x" data-a="close">✕</button></div><div class="sh-b">'
   +s.items.map(function(i){return '<div class="kv"><span>'+i.qty+' × '+esc(i.name)+'</span><b>'+fmt(i.qty*i.price)+'</b></div>'}).join('')
   +(s.disc?'<div class="kv"><span>Discount</span><b>−'+fmt(s.disc)+'</b></div>':'')
   +'<div class="kv"><span>Total</span><b>'+money(s.total)+'</b></div><div class="kv"><span>Paid ('+esc(s.method)+')</span><b>'+money(s.paid)+'</b></div>'
   +(bal>0?'<div class="kv"><span>Balance owed</span><b class="warn">'+money(bal)+'</b></div>':'')
   +'<div class="kv"><span>Date</span><b>'+fdt(s.ts)+'</b></div>'+(c?'<div class="kv"><span>Customer</span><b>'+esc(c.name)+'</b></div>':'')+(s.note?'<div class="kv"><span>Note</span><b>'+esc(s.note)+'</b></div>':'')
   +'</div><div class="sh-f"><button class="btn danger" data-a="void" data-id="'+id+'">Cancel sale</button>'+(bal>0?'<button class="btn pri" data-a="paysale" data-id="'+id+'">Receive payment</button>':'<button class="btn pri" data-a="receipt" data-id="'+id+'">Receipt</button>')+'</div>');
}
function voidSale(id){
  var s=DB.sales.find(function(x){return x.id===id});if(!s)return;
  s.items.forEach(function(i){var p=prod(i.pid);if(p)p.qty+=i.qty});
  DB.sales=DB.sales.filter(function(x){return x.id!==id});save();closeSheet();render();toast('Sale cancelled, stock returned');
}
function paySale(id){
  var s=DB.sales.find(function(x){return x.id===id});if(!s)return;var bal=s.total-s.paid;
  form('Receive payment',[{k:'amt',l:'Amount ('+DB.settings.cur+')',t:'num',def:bal,req:1},{k:'method',l:'Method',t:'select',o:METHODS}],{},function(v){
    var a=Math.min(v.amt,bal);if(a<=0){toast('Enter an amount');return false}
    s.paid+=a;s.pays.push({date:ymd(),amt:a,method:v.method});save();closeSheet();render();toast('Payment saved');
  });
}

  return items.map(function(p){return '<button class="row" data-a="prod" data-id="'+p.id+'"><div class="grow"><b>'+esc(p.name)+'</b><small>'+esc(p.cat)+(p.brand?' · '+esc(p.brand):'')+(p.sku?' · '+esc(p.sku):'')+'</small></div><div class="r"><b>'+money(p.price)+'</b><span class="pill '+(p.qty<=0?'bad':p.qty<=p.min?'warn':'')+'">'+p.qty+' left</span></div></button>'}).join('');

function prodFields(){return [
  {k:'name',l:'Product name',t:'text',p:'e.g. Tecno Spark 10 64GB',req:1},

  {k:'brand',l:'Brand',t:'text',half:1,p:'Tecno, Samsung…'},

function addProduct(){

    DB.products.push({id:uid(),name:v.name,cat:v.cat,brand:v.brand,sku:v.sku,cost:v.cost,price:v.price,qty:v.qty,min:v.min,sup:v.sup});

function prodSheet(id){

function editProduct(id){
  var p=prod(id);
  form('Edit product',prodFields(),p,function(v){
    if(v.price<=0){toast('Enter the selling price');return false}
    Object.assign(p,{name:v.name,cat:v.cat,brand:v.brand,sku:v.sku,cost:v.cost,price:v.price,qty:v.qty,min:v.min,sup:v.sup});
    save();closeSheet();render();toast('Saved');
  },function(){ask('Delete '+esc(p.name)+'? Past sales stay in your records.',function(){DB.products=DB.products.filter(function(x){return x.id!==id});save();closeSheet();render();toast('Deleted')})});
}
function restock(id){
  var p=prod(id);
  form('Add stock: '+esc(p.name),[{k:'qty',l:'Quantity received',t:'num',req:1},{k:'cost',l:'Buying price each',t:'num',def:p.cost},{k:'sup',l:'Supplier',t:'select',o:[['','None']].concat(DB.suppliers.map(function(s){return[s.id,s.name]})),def:p.sup||''}],{},function(v){
    if(v.qty<=0){toast('Enter the quantity');return false}
    p.qty+=v.qty;p.cost=v.cost;if(v.sup)p.sup=v.sup;
    DB.purchases.push({id:uid(),date:ymd(),pid:id,name:p.name,qty:v.qty,cost:v.cost,sup:v.sup});
    save();closeSheet();render();toast('Stock updated');
  });
}

}
var CF=[{k:'name',l:'Name',t:'text',req:1},{k:'phone',l:'Phone',t:'tel'},{k:'note',l:'Note',t:'area'}];
function editCust(id){
  var c=id?cust(id):null;
  form(c?'Edit customer':'Add customer',CF,c||{},function(v){
    if(c)Object.assign(c,v);else DB.customers.push({id:uid(),name:v.name,phone:v.phone,note:v.note});
    save();closeSheet();render();toast('Saved');
  },c?function(){ask('Delete '+esc(c.name)+'?',function(){DB.customers=DB.customers.filter(function(x){return x.id!==id});save();closeSheet();render()})}:null);
}
function suppView(){
  return '<button class="btn pri wide" data-a="addsupp">+ Add supplier</button><div class="list">'+(DB.suppliers.length?DB.suppliers.map(function(c){
    var o=sum(DB.payables.filter(function(p){return p.sup===c.id}),function(p){return p.amount-p.paid});
    return '<button class="row" data-a="supp" data-id="'+c.id+'"><div class="grow"><b>'+esc(c.name)+'</b><small>'+esc(c.phone||'No phone')+(c.items?' · '+esc(c.items):'')+'</small></div><div class="r">'+(o>0?'<b class="warn">'+money(o)+'</b><small>you owe</small>':'')+'</div></button>'}).join(''):empty('No suppliers yet','Add the people you buy phones and accessories from.'))+'</div>';
}
function editSupp(id){
  var c=id?supp(id):null;
  form(c?'Edit supplier':'Add supplier',[{k:'name',l:'Name / company',t:'text',req:1},{k:'phone',l:'Phone',t:'tel'},{k:'items',l:'What they supply',t:'text',p:'e.g. Chargers, cases'},{k:'note',l:'Note',t:'area'}],c||{},function(v){
    if(c)Object.assign(c,v);else DB.suppliers.push({id:uid(),name:v.name,phone:v.phone,items:v.items,note:v.note});
    save();closeSheet();render();toast('Saved');
  },c?function(){ask('Delete '+esc(c.name)+'?',function(){DB.suppliers=DB.suppliers.filter(function(x){return x.id!==id});save();closeSheet();render()})}:null);
}

/* ---------- expenses ---------- */
function expView(){
  var st=stats(S.period);
  return chipsPeriod()+'<div class="card" style="margin-bottom:10px"><small>Total expenses</small><b>'+money(st.exp)+'</b></div><button class="btn pri wide" data-a="addexp">+ Add expense</button><div class="list">'
   +(st.exps.length?st.exps.slice().sort(function(a,b){return b.date<a.date?-1:1}).map(function(e){return '<button class="row" data-a="exp" data-id="'+e.id+'"><div class="grow"><b>'+esc(e.cat)+'</b><small>'+fdate(e.date)+(e.note?' · '+esc(e.note):'')+'</small></div><div class="r"><b>'+money(e.amount)+'</b></div></button>'}).join(''):empty('No expenses in this period'))+'</div>';
}
function editExp(id){
  var e=id?DB.expenses.find(function(x){return x.id===id}):null;
  form(e?'Edit expense':'Add expense',[{k:'cat',l:'Type',t:'select',o:EXPCATS},{k:'amount',l:'Amount ('+DB.settings.cur+')',t:'num',req:1},{k:'date',l:'Date',t:'date',def:ymd()},{k:'note',l:'Note',t:'text'}],e||{date:ymd()},function(v){
    if(v.amount<=0){toast('Enter the amount');return false}
    if(e)Object.assign(e,v);else DB.expenses.push({id:uid(),cat:v.cat,amount:v.amount,date:v.date||ymd(),note:v.note});
    save();closeSheet();render();toast('Expense saved');
  },e?function(){ask('Delete this expense?',function(){DB.expenses=DB.expenses.filter(function(x){return x.id!==id});save();closeSheet();render()})}:null);
}

/* ---------- debts ---------- */
function debtView(){
  var seg='<div class="seg"><button class="'+(S.debtT==='in'?'on':'')+'" data-a="debtT" data-v="in">Owed to me</button><button class="'+(S.debtT==='out'?'on':'')+'" data-a="debtT" data-v="out">I owe</button></div>';
  if(S.debtT==='in'){
    var d=DB.sales.filter(function(s){return s.total-s.paid>0});
    return seg+'<div class="card" style="margin-bottom:10px"><small>Customers owe you</small><b>'+money(sum(d,function(s){return s.total-s.paid}))+'</b></div><div class="list">'+(d.length?d.map(function(s){var c=cust(s.cust);return '<button class="row" data-a="sale" data-id="'+s.id+'"><div class="grow"><b>'+esc(c?c.name:'Customer')+'</b><small>Sale #'+s.no+' · '+fdate(s.date)+'</small></div><div class="r"><b class="warn">'+money(s.total-s.paid)+'</b></div></button>'}).join(''):empty('Nobody owes you','Part-paid sales will appear here.'))+'</div>';
  }
  var p=DB.payables;
  return seg+'<div class="card" style="margin-bottom:10px"><small>You owe</small><b>'+money(sum(p,function(x){return x.amount-x.paid}))+'</b></div><button class="btn pri wide" data-a="addpay">+ Add debt</button><div class="list">'+(p.length?p.map(function(x){var s=supp(x.sup);return '<button class="row" data-a="pay" data-id="'+x.id+'"><div class="grow"><b>'+esc(s?s.name:x.party)+'</b><small>'+fdate(x.date)+(x.note?' · '+esc(x.note):'')+'</small></div><div class="r"><b class="'+(x.amount-x.paid>0?'warn':'good')+'">'+(x.amount-x.paid>0?money(x.amount-x.paid):'Paid')+'</b></div></button>'}).join(''):empty('No debts recorded','Record stock you took on credit from suppliers.'))+'</div>';
}
function editPay(id){
  var x=id?DB.payables.find(function(y){return y.id===id}):null;
  form(x?'Edit debt':'Add debt',[{k:'sup',l:'Supplier',t:'select',o:[['','Someone else (type below)']].concat(DB.suppliers.map(function(s){return[s.id,s.name]}))},{k:'party',l:'Name (if not a saved supplier)',t:'text'},{k:'amount',l:'Total owed',t:'num',half:1,req:1},{k:'paid',l:'Paid so far',t:'num',half:1},{k:'note',l:'Note',t:'text'}],x||{},function(v){
    if(v.amount<=0){toast('Enter the amount owed');return false}
    if(!v.sup&&!v.party){toast('Choose a supplier or type a name');return false}
    if(x)Object.assign(x,v);else DB.payables.push({id:uid(),date:ymd(),sup:v.sup,party:v.party,amount:v.amount,paid:v.paid,note:v.note});
    save();closeSheet();render();toast('Saved');
  },x?function(){ask('Delete this debt record?',function(){DB.payables=DB.payables.filter(function(y){return y.id!==id});save();closeSheet();render()})}:null);
}

/* ---------- reports ---------- */
function repView(){
  var st=stats(S.period),items={},cats={},meth={};
  st.sales.forEach(function(s){s.items.forEach(function(i){var o=items[i.name]||(items[i.name]={q:0,r:0});o.q+=i.qty;o.r+=i.qty*i.price;var c=cats[i.cat]||0;cats[i.cat]=c+i.qty*i.price});meth[s.method]=(meth[s.method]||0)+s.total});
  var top=Object.keys(items).map(function(k){return[k,items[k]]}).sort(function(a,b){return b[1].q-a[1].q}).slice(0,6);
  var days=[],i;for(i=6;i>=0;i--){var d=new Date();d.setDate(d.getDate()-i);days.push(d)}
  var vals=days.map(function(d){var k=ymd(d);return sum(DB.sales.filter(function(s){return s.date===k}),function(s){return s.total})}),mx=Math.max.apply(null,vals.concat([1]));
  var WD=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
  var bars='<div class="bars">'+days.map(function(d,j){return '<div><i style="height:'+Math.round(vals[j]/mx*82)+'px"></i>'+WD[d.getDay()]+'</div>'}).join('')+'</div>';
  var tape='<div class="tape"><div class="l"><span>Sales</span><b>'+money(st.rev)+'</b></div><div class="l"><span>Repair income</span><b>'+money(st.rrev)+'</b></div><div class="l"><span>Cost of goods and parts</span><b>−'+fmt(st.cogs+st.rcost)+'</b></div><div class="l"><span>Gross profit</span><b>'+money(st.gross)+'</b></div><div class="l"><span>Expenses</span><b>−'+fmt(st.exp)+'</b></div><div class="l"><span><b style="color:var(--ink)">Net profit</b></span><b class="'+(st.net<0?'bad':'good')+'" style="font-size:18px">'+money(st.net)+'</b></div></div>';
  var catTot=sum(Object.keys(cats),function(k){return cats[k]})||1;
  var low=DB.products.filter(function(p){return p.qty<=p.min});
  return chipsPeriod()+tape
   +'<div class="card"><small>Sales, last 7 days</small>'+bars+'</div>'
   +'<div class="sec">Best sellers</div><div class="list">'+(top.length?top.map(function(t){return '<div class="row"><div class="grow"><b>'+esc(t[0])+'</b><small>'+t[1].q+' sold</small></div><div class="r"><b>'+money(t[1].r)+'</b></div></div>'}).join(''):empty('No sales in this period'))+'</div>'
   +'<div class="sec">Sales by category</div><div class="list">'+Object.keys(cats).sort(function(a,b){return cats[b]-cats[a]}).map(function(k){return '<div class="card"><div style="display:flex;justify-content:space-between"><span>'+esc(k)+'</span><b>'+money(cats[k])+'</b></div><div class="bar"><i style="width:'+Math.round(cats[k]/catTot*100)+'%"></i></div></div>'}).join('')+'</div>'
   +'<div class="sec">Payment methods</div><div class="list">'+Object.keys(meth).map(function(k){return '<div class="row"><div class="grow"><b>'+esc(k)+'</b></div><div class="r"><b>'+money(meth[k])+'</b></div></div>'}).join('')+'</div>'
   +'<div class="sec">Low or finished stock</div><div class="list">'+(low.length?low.map(function(p){return '<div class="row"><div class="grow"><b>'+esc(p.name)+'</b></div><div class="r"><span class="pill '+(p.qty<=0?'bad':'warn')+'">'+p.qty+' left</span></div></div>'}).join(''):empty('Stock levels look fine'))+'</div>';
}

/* ---------- categories ---------- */
function catView(){
  return '<div class="card" style="margin-bottom:10px"><div class="fld"><span>New category</span><div style="display:flex;gap:8px"><input id="newcat" placeholder="e.g. Batteries"><button class="btn pri" data-a="addcat">Add</button></div></div></div><div class="list">'
   +DB.cats.map(function(c,i){var n=DB.products.filter(function(p){return p.cat===c}).length;return '<div class="row"><div class="grow"><b>'+esc(c)+'</b><small>'+n+' product'+(n===1?'':'s')+'</small></div><button class="btn" data-a="delcat" data-i="'+i+'">Remove</button></div>'}).join('')+'</div>';
}

/* ---------- settings ---------- */
function setView(){
  var s=DB.settings;
  return '<div class="card"><div class="form"><label class="fld"><span>Shop name on receipts</span><input id="s_shop" value="'+esc(s.shop)+'"></label><label class="fld half"><span>Currency label</span><input id="s_cur" value="'+esc(s.cur)+'"></label><label class="fld half"><span>Default low-stock warning</span><input id="s_low" type="number" inputmode="numeric" value="'+esc(s.low)+'"></label></div><button class="btn pri wide" style="margin-top:12px" data-a="savesettings">Save settings</button></div>'
   +'<div class="sec">PIN lock</div><div class="card"><div class="note" style="margin-top:0">'+(s.pin?'A PIN is set. LATRONIC asks for it each time you open the app.':'No PIN yet. Set one so nobody else can open your shop records.')+'</div><div style="display:flex;gap:8px"><button class="btn pri" style="flex:1" data-a="setpin">'+(s.pin?'Change PIN':'Set PIN')+'</button>'+(s.pin?'<button class="btn" style="flex:1" data-a="rmpin">Remove PIN</button>':'')+'</div></div>'
   +'<div class="sec">Backup</div><div class="card"><div class="note" style="margin-top:0">Your records live in this phone\'s browser. If you clear browser data or change phones they are lost, so save a backup copy somewhere safe (for example send it to yourself on WhatsApp).</div><div style="display:flex;gap:8px"><button class="btn pri" style="flex:1" data-a="backup">Create backup</button><button class="btn" style="flex:1" data-a="restore">Restore</button></div></div>'
   +'<div class="sec">Danger zone</div><button class="btn danger wide" data-a="wipe">Erase all data</button>';
}
function backupSheet(){
  var t=JSON.stringify(DB);
  openSheet('<div class="sh-h"><b>Backup</b><button class="x" data-a="close">✕</button></div><div class="sh-b"><div class="note" style="margin-top:0">Copy this text and keep it safe. Paste it into Restore to bring your records back.</div><textarea id="bk" rows="8" readonly>'+esc(t)+'</textarea></div><div class="sh-f"><button class="btn pri" data-a="copy" data-v="bk">Copy backup</button></div>');
}
function restoreSheet(){
  openSheet('<div class="sh-h"><b>Restore</b><button class="x" data-a="close">✕</button></div><div class="sh-b"><div class="note" style="margin-top:0">Paste your backup text below. This replaces everything currently in LATRONIC.</div><textarea id="rs" rows="8" placeholder="Paste backup here"></textarea></div><div class="sh-f"><button class="btn pri" data-a="dorestore">Restore now</button></div>');
}
function doRestore(){
  try{
    var d=JSON.parse($('#rs').value.trim());
    if(!d||!Array.isArray(d.products)||!d.settings)throw 0;
    var df=defaults();for(var k in df){if(d[k]===undefined)d[k]=df[k]}
    DB=d;save();locked=!!DB.settings.pin;closeSheet();render();toast('Backup restored');
  }catch(e){toast('That does not look like a LATRONIC backup')}
}
function setPin(){
  form('Set PIN',[{k:'pin',l:'New PIN (4 to 6 digits)',t:'tel',req:1}],{},function(v){
    if(!/^\d{4,6}$/.test(v.pin)){toast('Use 4 to 6 digits');return false}
    DB.settings.pin=hp(v.pin);save();closeSheet();render();toast('PIN saved');
  });
}

/* ---------- sheets & forms ---------- */
var FORM=null,ASK=null;
function openSheet(h){var s=$('#sheet');s.innerHTML='<div class="back" data-a="close"></div><div class="sheet">'+h+'</div>';s.className='open'}
function closeSheet(){var s=$('#sheet');s.className='';s.innerHTML='';FORM=null}
function ask(msg,yes){ASK=yes;openSheet('<div class="sh-h"><b>Are you sure?</b><button class="x" data-a="close">✕</button></div><div class="sh-b"><p style="margin:4px 0 8px">'+msg+'</p></div><div class="sh-f"><button class="btn" data-a="close">Cancel</button><button class="btn danger" data-a="yes">Yes, continue</button></div>')}
function form(title,fields,init,save,del){
  FORM={fields:fields,save:save,del:del};
  var h=fields.map(function(f){
    var v=init&&init[f.k]!=null&&init[f.k]!==''?init[f.k]:(f.def!=null?f.def:''),inp;
    if(f.t==='select'){inp='<select id="f_'+f.k+'">'+f.o.map(function(o){var val=Array.isArray(o)?o[0]:o,lab=Array.isArray(o)?o[1]:o;return '<option value="'+esc(val)+'" '+(String(v)===String(val)?'selected':'')+'>'+esc(lab)+'</option>'}).join('')+'</select>'}
    else if(f.t==='area'){inp='<textarea id="f_'+f.k+'" rows="3" placeholder="'+esc(f.p||'')+'">'+esc(v)+'</textarea>'}
    else{inp='<input id="f_'+f.k+'" type="'+(f.t==='num'?'number':f.t==='tel'?'tel':f.t==='date'?'date':'text')+'" '+(f.t==='num'?'inputmode="decimal" min="0" step="any" ':'')+'value="'+esc(v)+'" placeholder="'+esc(f.p||'')+'">'}
    return '<label class="fld '+(f.half?'half':'')+'"><span>'+f.l+'</span>'+inp+'</label>';
  }).join('');
  openSheet('<div class="sh-h"><b>'+title+'</b><button class="x" data-a="close">✕</button></div><div class="sh-b"><div class="form">'+h+'</div></div><div class="sh-f">'+(del?'<button class="btn danger" data-a="fdel">Delete</button>':'')+'<button class="btn pri" data-a="fsave">Save</button></div>');
}
function submitForm(){
  if(!FORM)return;var o={},bad=null;
  FORM.fields.forEach(function(f){var el=$('#f_'+f.k),v=el.value;if(f.t==='num')v=v===''?0:+v;else v=v.trim();o[f.k]=v;if(f.req&&(v===''||v===undefined)&&!bad)bad=f.l});
  if(bad){toast('Please fill in: '+bad);return}
  var f=FORM;if(f.save(o)===false)return;
}
function copyText(id){
  var el=$('#'+id),t=el.value!==undefined&&el.tagName==='TEXTAREA'?el.value:el.textContent;
  function fallback(){try{var ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();var ok=document.execCommand('copy');ta.remove();if(!ok)throw 0;toast('Copied')}catch(e){if(el.select){el.select()}toast('Press and hold the text, then tap Copy')}}
  try{navigator.clipboard.writeText(t).then(function(){toast('Copied')},fallback)}catch(e){fallback()}
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var el=e.target.closest('[data-a]');if(!el)return;
  var a=el.dataset.a,v=el.dataset.v,id=el.dataset.id,i=el.dataset.i;
  switch(a){
    case'tab':S.tab=v;S.sub=null;render();break;
    case'go':S.tab=v;S.sub=null;render();break;
    case'sub':S.sub=v;S.period=v==='reports'?'month':'today';render();break;
    case'back':S.sub=null;render();break;
    case'lock':if(DB.settings.pin){locked=true;render()}break;
    case'k':pinKey(v);break;
    case'period':S.period=v;render();break;
    case'sm':S.sm=v;render();break;
    case'cat':S.cat=v;render();break;
    case'cat2':S.cat2=v;render();break;
    case'repF':S.repF=v;render();break;
    case'debtT':S.debtT=v;render();break;
    case'add':addToCart(id);break;
    case'custom':form('Custom item or service',[{k:'name',l:'Item or service',t:'text',req:1,p:'e.g. Screen fitting, airtime'},{k:'price',l:'Price',t:'num',half:1,req:1},{k:'qty',l:'Quantity',t:'num',half:1,def:1},{k:'cost',l:'Your cost (optional)',t:'num'}],{},function(x){if(x.price<=0||x.qty<=0){toast('Enter price and quantity');return false}S.cart.push({pid:'',name:x.name,cat:'Other accessories',qty:x.qty,price:x.price,cost:x.cost});closeSheet();render()});break;
    case'cart':cartSheet();break;
    case'cq':readCart();var c=S.cart[+i],n=c.qty+(+v);if(n>0&&c.pid){var pp=prod(c.pid);if(pp&&n>pp.qty){toast('Only '+pp.qty+' in stock');break}}if(n<=0)S.cart.splice(+i,1);else c.qty=n;cartSheet();break;
    case'clearcart':S.cart=[];S.disc='';S.paid='';closeSheet();render();break;
    case'finish':finishSale();break;
    case'sale':saleSheet(id);break;
    case'receipt':receiptSheet(DB.sales.find(function(x){return x.id===id}),false);break;
    case'void':ask('Cancel this sale? The items go back into stock.',function(){voidSale(id)});break;
    case'paysale':paySale(id);break;
    case'addprod':addProduct();break;
    case'prod':prodSheet(id);break;
    case'editprod':editProduct(id);break;
    case'restock':restock(id);break;
    case'addrep':addRepair();break;
    case'rep':repSheet(id);break;
    case'rstat':setRepStatus(id,v);break;
    case'editrep':editRepair(id);break;
    case'addcust':editCust();break;
    case'cust':editCust(id);break;
    case'addsupp':editSupp();break;
    case'supp':editSupp(id);break;
    case'addexp':editExp();break;
    case'exp':editExp(id);break;
    case'addpay':editPay();break;
    case'pay':editPay(id);break;
    case'addcat':var nc=$('#newcat').value.trim();if(!nc)break;if(DB.cats.indexOf(nc)>-1){toast('Category already exists');break}DB.cats.push(nc);save();render();break;
    case'delcat':var cn=DB.cats[+i];ask('Remove category '+esc(cn)+'? Products keep their label.',function(){DB.cats.splice(+i,1);save();closeSheet();render()});break;
    case'savesettings':DB.settings.shop=$('#s_shop').value.trim()||'LATRONIC';DB.settings.cur=$('#s_cur').value.trim()||'TSh';DB.settings.low=+$('#s_low').value||3;save();toast('Settings saved');break;
    case'setpin':setPin();break;
    case'rmpin':ask('Remove the PIN lock?',function(){DB.settings.pin='';save();closeSheet();render()});break;
    case'backup':backupSheet();break;
    case'restore':restoreSheet();break;
    case'dorestore':doRestore();break;
    case'wipe':ask('This erases every product, sale, customer and record on this phone. Make a backup first if you need one.',function(){DB=defaults();save();S.cart=[];locked=false;closeSheet();S.sub=null;S.tab='home';render();toast('All data erased')});break;
    case'copy':copyText(v);break;
    case'fsave':submitForm();break;
    case'fdel':if(FORM&&FORM.del)FORM.del();break;
    case'yes':var y=ASK;ASK=null;if(y)y();break;
    case'close':closeSheet();break;
  }
});
document.addEventListener('input',function(e){
  var t=e.target;
  if(t.id==='q1'){S.q1=t.value;$('#list').innerHTML=sellList()}
  else if(t.id==='q2'){S.q2=t.value;$('#list').innerHTML=stockList()}
  else if(t.id==='c_disc'){S.disc=t.value;$('#c_tot').textContent=money(cartTotal())}
});
render();
</script>
</body>
</html>
